# What to read next
# 原文: https://www.bitbybitbook.com/en/1st-ed/observing-behavior/observing-what-to-read-next/
# 每段一条,id 对应页面上的段落编号。status: todo / draft / reviewed
# 可选字段(按需添加): vocab([{term, gloss}])、syntax、background
blocks: 66   # 原文段落数,build 时校验
paragraphs:
- id: 1
  status: draft
  ja: |
    序論（第2.1節）
  point: |
    第2.1節「序論」に関する追加文献の見出しである。
- id: 2
  status: draft
  ja: |
    この章では、エスノグラフィーの観察が含まれていません。デジタル空間におけるエスノグラフィーについては、Boellstorff et al. (2012)を参照してください。デジタルと物理の両方の空間におけるエスノグラフィーについては、Lane (2016)を参照してください。
  point: |
    この章ではエスノグラフィーが含まれていない。
    「エスノグラフィー」は現場での観察などを通じて人々の生活や文化を調べる方法である。
  vocab:
    - {term: "ethnography", gloss: "エスノグラフィー"}
- id: 3
  status: draft
  ja: |
    ビッグデータ（第2.2節）
  point: |
    第2.2節「ビッグデータ」に関する追加文献の見出しである。
- id: 4
  status: draft
  ja: |
    「ビッグデータ」の定義は一元的ではないが、多くの定義は「3V」、つまりボリューム、バリエーション、およびVelocityに焦点を当てている（例えば、Japec et al. (2015)）。De Mauro et al. (2015)は、その定義のレビューを提供している。
  point: |
    「ビッグデータ」の定義は「3V」に焦点を当てることが多いが、一元的な定義はない。
  vocab:
    - {term: "velocity", gloss: "生成・更新の速さ"}
    - {term: "variety", gloss: "多様性"}
    - {term: "volume", gloss: "データ量"}
- id: 5
  status: draft
  ja: |
    私の大規模データのカテゴリーに政府行政データを含めるのは少し異例ですが、Legewie（2015）、Connellyら（2016）、EinavとLevin（2014）も同様の主張をしています。政府行政データの研究における価値については、Cardら（2010）、Administrative Data Taskforce（2012）、Grusky、Smeeding、Snipp（2015）を参照してください。
  point: |
    政府行政データが大規模データの一部として扱われることがあり、その研究価値は多くの研究で指摘されている。
    「行政データ」は行政機関が業務のために作成・保存するデータである。
  vocab:
    - {term: "administrative data", gloss: "行政データ"}
- id: 6
  status: draft
  ja: |
    政府統計システム内、特に米国国勢調査局からの行政研究の視点については、JarminとO'Hara (2016)を参照してください。スウェーデン統計庁における行政記録研究に関する書籍の取り扱いについては、WallgrenとWallgren (2007)を参照してください。
  point: |
    米国の国勢調査局やスウェーデン統計庁における行政研究についての文献が紹介されている。
  vocab:
    - {term: "administrative records", gloss: "行政記録"}
- id: 7
  status: draft
  ja: |
    この章では、一般的社会調査（GSS）のような伝統的な調査と、Twitterのようなソーシャルメディアデータ源を簡単に比較した。伝統的な調査とソーシャルメディアデータの詳細かつ慎重な比較については、Schoberら（2016）を参照のこと。
  point: |
    伝統的な調査とソーシャルメディアデータの比較を行った。
  vocab:
    - {term: "General Social Survey", gloss: "一般社会調査（GSS）"}
- id: 8
  status: draft
  ja: |
    大規模データの一般的な特性（第2.3節）
  point: |
    第2.3節「ビッグデータ源に共通する特性」に関する追加文献の見出しである。
- id: 9
  status: draft
  ja: |
    これらのビッグデータの10の特徴は、様々な著者が異なる方法で説明してきました。これらの問題に関する私の考えに影響を与えた文献には、Lazer et al. (2009)、Groves (2011)、Howison, Wiggins, and Crowston (2011)、boyd and Crawford (2012)、S. J. Taylor (2013)、Mayer-Schönberger and Cukier (2013)、Golder and Macy (2014)、Ruths and Pfeffer (2014)、Tufekci (2014)、Sampson and Small (2015)、K. Lewis (2015b)、Lazer (2015)、Horton and Tambe (2015)、Japec et al. (2015)、およびGoldstone and Lupyan (2016)が含まれます。
  point: |
    ビッグデータの10の特徴について、多くの著者の文献が言及されている。
- id: 10
  status: draft
  ja: |
    この章では、相対的に中立的な「デジタル痕跡」という用語を使用してきました。デジタル痕跡のもう一つの一般的な呼び方はデジタル足跡ですが、Hal Abelson、Ken Ledeen、Harry Lewis（2008）は、デジタル痕跡はむしろデジタル指紋と呼ぶべきだと指摘しています。足跡は自分が何をしているか認識しており、通常個人に特定することはできませんが、デジタル痕跡はその限りではありません。実際、自分がほとんど知らないまま痕跡を常に残しています。これらの痕跡には名前が記載されていませんが、しばしば個人に結びつけられます。つまり、それらは指紋のように見えないかつ個人を特定できるものです。
  point: |
    デジタル痕跡は個人を特定できるため、デジタル指紋と呼ぶべきである。
    「デジタル痕跡」は日常のデジタルな活動に伴って残る行動記録である。
  vocab:
    - {term: "digital traces", gloss: "デジタル痕跡"}
    - {term: "digital fingerprints", gloss: "デジタル指紋"}
    - {term: "digital footprints", gloss: "デジタル足跡"}
- id: 11
  status: draft
  ja: |
    大きな（セクション2.3.1）
  point: |
    第2.3.1節「大規模」に関する追加文献の見出しである。
- id: 12
  status: draft
  ja: |
    より大きなデータセットが統計的検定を問題にする理由については、M. Lin, Lucas, および Shmueli (2013) と McFarland および McFarland (2015) を参照してください。これらの問題は、研究者が統計的有意性ではなく実践的有意性に焦点を当てるべきであることを示しています。
  point: |
    研究者が実践的有意性に注目すべきである。
  vocab:
    - {term: "statistical significance", gloss: "統計的有意性"}
    - {term: "practical significance", gloss: "実質的な重要性"}
    - {term: "large datasets", gloss: "大規模データセット"}
- id: 13
  status: draft
  ja: |
    詳細については、Mervis (2014) を参照してください。
  point: |
    Raj Chettyと同僚が税務記録へのアクセスを得る方法について述べている。
  vocab:
    - {term: "tax records", gloss: "税務記録"}
- id: 14
  status: draft
  ja: |
    大規模なデータセットは、一般的に単一のコンピュータの能力を超える計算上の問題を引き起こすことがあります。そのため、大規模なデータセット上で計算を行う研究者は、その作業を多くのコンピュータに分散させることがよくあり、このプロセスは平行プログラミングと呼ばれることもあります。平行プログラミング、特にHadoopという言語についての入門については、VoとSilvia（2016）を参照してください。
  point: |
    大規模データセットの計算を多くのコンピュータに分散させる平行プログラミングがある。
    「大規模データセット」は多くの観測値を含むデータの集合である。
  vocab:
    - {term: "parallel programming", gloss: "並列プログラミング"}
    - {term: "computational", gloss: "計算に関する"}
- id: 15
  status: draft
  ja: |
    常にオンである（第2.3.2節）
  point: |
    第2.3.2節「常時稼働」に関する追加文献の見出しである。
  vocab:
    - {term: "always-on", gloss: "常時稼働の"}
- id: 16
  status: draft
  ja: |
    常に利用可能なデータを考える際には、同じ人々の経時的な比較を行っているのか、それとも変化する人々のグループを比較しているのかを考慮することが重要である；例えば、Diaz et al. (2016)を参照のこと。
  point: |
    常に利用可能なデータを分析する際、同一人物の経時的変化と異なるグループ間の比較を区別することが重要である。
  vocab:
    - {term: "always-on", gloss: "常時稼働の"}
- id: 17
  status: draft
  ja: |
    非反応的（第¿sec:non-reactive?節）
  point: |
    第2.3.3節「非反応的」に関する追加文献の見出しである。非反応的とは、観察されることで行動が変わりにくい性質を指す。
  vocab:
    - {term: "nonreactive", gloss: "非反応的な"}
- id: 18
  status: draft
  ja: |
    ウェブら（1966）は非反応的測定に関する古典的な書籍であり、その書籍中の例はデジタル時代以前のものだが、依然として示唆的である。大規模監視の存在により人々の行動が変化する例については、ペンニー（2016）とブレイン（2014）を参照されたい。
  point: |
    非反応的測定に関する古典的な書籍の例はデジタル時代以前のものだが示唆的であり、大規模監視の存在により人々の行動が変化する例もある。
    「非反応的」は測定されること自体で人々の行動が変わりにくい性質である。
  vocab:
    - {term: "nonreactive", gloss: "非反応的な"}
- id: 19
  status: draft
  ja: |
    反応性は、研究者が要求効果（Orne 1962; Zizzo 2010）とハーサム効果（Adair 1984; Levitt and List 2011）と呼ぶ現象と密接に関連しています。
  point: |
    反応性は要求効果とハーサム効果と密接に関連している。
    「反応性」は観察・測定されることで対象の行動が変わることである。
  vocab:
    - {term: "reactivity", gloss: "反応性"}
    - {term: "Hawthorne effect", gloss: "ホーソン効果"}
    - {term: "demand effects", gloss: "要求特性による影響"}
- id: 20
  status: draft
  ja: |
    不完全（第2.3.4節）
  point: |
    第2.3.4節「不完全」に関する追加文献の見出しである。ここでの不完全とは、研究に必要な情報がデータに欠けていることを指す。
  vocab:
    - {term: "incomplete", gloss: "不完全な"}
- id: 21
  status: draft
  ja: |
    レコードリンクについては、Dunn (1946)、Fellegi and Sunter (1969)（歴史的）、Larsen and Winkler (2014)（現代的）を参照してください。コンピュータサイエンス分野では、データデダプリケーション、インスタンス識別、名前照合、重複検出、重複レコード検出などという名称で同様のアプローチが開発されています（Elmagarmid, Ipeirotis, and Verykios 2007）。また、個人を特定できる情報を送信することなくレコードをリンクするプライバシー保護型の手法もあります（Schnell 2013）。Facebookは、投票行動と関連付けるためのレコードリンクプロセスを開発し、これは第4章で述べる実験の評価のために行われました（Bond et al. 2012; Jones et al. 2013）。
  point: |
    レコードリンクに関する歴史的・現代的手法と、Facebookが投票行動と関連付けるためのレコードリンクプロセスを開発したことが述べられている。
    「レコードリンク」は異なるデータ源の同一人物などの記録を結びつけることである。
  vocab:
    - {term: "record linkage", gloss: "記録の照合・連結"}
    - {term: "matching", gloss: "マッチング"}
    - {term: "privacy", gloss: "プライバシー"}
- id: 22
  status: draft
  ja: |
    構成妥当性については、Shadish, Cook, and Campbell (2001) の第3章を参照してください。
  point: |
    構成妥当性についての詳細はShadish, Cook, and Campbell (2001)の第3章に記載されている。
  vocab:
    - {term: "construct validity", gloss: "構成概念妥当性"}
- id: 23
  status: draft
  ja: |
    アクセス不能（第2.3.5節）
  point: |
    第2.3.5節「アクセス不能」に関する追加文献の見出しである。
  vocab:
    - {term: "inaccessible", gloss: "アクセス困難な"}
- id: 24
  status: draft
  ja: |
    AOL検索ログ問題については、Ohm (2010)を参照してください。第4章で実験について説明する際に、企業や政府との提携に関する助言を提供します。アクセス不可能なデータに依存した研究に対する懸念を表明した著者は複数おり、Huberman (2012)およびboydとCrawford (2012)を参照してください。
  point: |
    AOL検索ログ問題とアクセス不可能なデータに依存した研究に対する懸念が指摘されている。
  vocab:
    - {term: "inaccessible", gloss: "アクセス困難な"}
- id: 25
  status: draft
  ja: |
    大学の研究者がデータアクセスを得る一つの良い方法は、インターンや訪問研究者の形で企業で働くことです。このプロセスはデータアクセスを可能にするとともに、分析において重要な役割を果たすデータの生成方法について研究者がより多く学ぶのにも役立ちます。
  point: |
    大学の研究者がデータアクセスを得るとともに、データ生成の理解を深めるために企業でインターンや訪問研究者として働くことが推奨される。
  vocab:
    - {term: "data access", gloss: "データへのアクセス"}
- id: 26
  status: draft
  ja: |
    政府データへのアクセスに関して、Mervis（2014）は、Raj Chettyと同僚が社会移動性に関する研究で使用した税務記録へのアクセスを得る方法について述べている。
  point: |
    Raj Chettyと同僚が社会移動性に関する研究で使用した税務記録へのアクセスを得る方法について説明している。
    「社会移動」は親の所得や地位と比べて子の所得や地位が変わることである。
  vocab:
    - {term: "social mobility", gloss: "社会移動"}
- id: 27
  status: draft
  ja: |
    非代表的な（非代表的：sec:non-representative）
  point: |
    第2.3.6節「非代表的」に関する追加文献の見出しである。
  vocab:
    - {term: "non-representative", gloss: "代表性のない"}
- id: 28
  status: draft
  ja: |
    「代表的」という概念の歴史については、Kruskal and Mosteller (1979a)、Kruskal and Mosteller (1979b)、Kruskal and Mosteller (1979c)、およびKruskal and Mosteller (1980)を参照してください。
  point: |
    「代表性」は標本が母集団の特徴をどの程度反映するかを指す。この概念の歴史を扱う文献を紹介している。
  vocab:
    - {term: "representativeness", gloss: "代表性"}
- id: 29
  status: draft
  ja: |
    私のスノウのコレラに関する研究の要約と、ドールとヒルの英国医師研究の要約は短かった。スノウのコレラに関する研究については、フリードマン（1991）を参照のこと。英国医師研究については、ドールら（2004）とキーティング（2014）を参照のこと。
  point: |
    スノウのコレラ研究と英国医師研究の詳細はそれぞれフリードマン（1991）、ドールら（2004）とキーティング（2014）に記載されている。
  vocab:
    - {term: "cholera", gloss: "コレラ"}
- id: 30
  status: draft
  ja: |
    多くの研究者は、ドールとヒルが女性医師や35歳未満の医師から収集したデータを最初の分析には使用しなかったことを知ることになるでしょう。彼らは次のように主張しました。「肺がんは女性や35歳未満の男性では相対的に珍しいため、これらのグループから有用なデータを得るには数年かかるだろう。この初報では、したがって35歳以上の男性に焦点を絞った。」ロスマン、ギャラチャー、ハッチ（2013）は、「代表性を避けるべき理由」という挑発的なタイトルで、意図的に非代表的なデータを作成することの価値についてより一般的な議論を行っています。
  point: |
    ドールとヒルは女性や若年層のデータを無視し、35歳以上の男性に焦点を絞った。
  vocab:
    - {term: "nonrepresentative", gloss: "代表性のない"}
- id: 31
  status: draft
  ja: |
    非代表性は、全体の人口について声明を出す研究者や政府にとって大きな問題です。これは、ユーザーに焦点を当てている企業にとってはそれほど心配する必要はありません。オランダ統計局がビジネスビッグデータの非代表性についてどのように考えているかについては、Buelens et al. (2014)を参照してください。
  point: |
    非代表性は研究者や政府にとって問題だが、企業にはそれほど心配ではない。
  vocab:
    - {term: "population", gloss: "母集団"}
- id: 32
  status: draft
  ja: |
    boydとCrawford（2012）、K. Lewis（2015b）、Hargittai（2015）などの研究者が、大規模データソースの代表性の欠如に対する懸念を表明しています。
  point: |
    研究者が大規模データソースの非代表的な性質への懸念を表明している。
  vocab:
    - {term: "non-representative", gloss: "代表性のない"}
- id: 33
  status: draft
  ja: |
    詳細な比較については、KeidingとLouis（2016）を参照してください。
  point: |
    社会調査の目的と疫学研究の目的の詳細な比較についてはKeidingとLouis（2016）を参照。
  vocab:
    - {term: "social surveys", gloss: "社会調査"}
    - {term: "epidemiological research", gloss: "疫学研究"}
- id: 34
  status: draft
  ja: |
    ツイッターを使用して投票者の外挙的な一般化を行う試みについて詳しく知りたい場合は、2009年のドイツ選挙の事例を含めて、Jungherr (2013)およびJungherr (2015)を参照してください。Tumasjan et al. (2010)の研究に続く世界各地の研究者は、より洗練された手法—例えば、政党に対する肯定的または否定的な言及を区別するために感情分析を使用する—を利用して、ツイッターのデータが様々な種類の選挙を予測する能力を向上させようとしました（Gayo-Avello 2013; Jungherr 2015, chap. 7）。Huberty (2015)はこれらの選挙予測の試みの結果を次のように要約しました。
  point: |
    Huberty (2015)が要約したように、世界中の研究者がツイッターのデータを様々な選挙の予測に利用しようと試みている。
  vocab:
    - {term: "sentiment analysis", gloss: "感情分析"}
    - {term: "out-of-sample", gloss: "標本外の"}
    - {term: "mentions", gloss: "言及数"}
- id: 35
  status: draft
  ja: |
    すべての既知のソーシャルメディアに基づく予測手法は、真の先行的選挙予測の要求にさらされると失敗します。これらの失敗は、ソーシャルメディアの基本的な性質によるものであり、方法論的またはアルゴリズム的な困難によるものではありません。要するに、ソーシャルメディアは、安定的で偏りのない代表的な有権者の写真を提供せず、おそらく今後も提供しないでしょう。また、ソーシャルメディアの便宜サンプルには、これらの問題を事後的に修正するのに十分なデータがありません。
  point: |
    ソーシャルメディアは有効な選挙予測に適していない。
  vocab:
    - {term: "representative", gloss: "代表性のある"}
    - {term: "forecasting", gloss: "予測"}
- id: 36
  status: draft
  ja: |
    第3章では、サンプリングと推定についてより詳細に説明します。データが非代表的であっても、特定の条件下では重み付けを行うことで良い推定を得ることが可能です。
  point: |
    非代表的なデータでも特定条件下では良い推定が得られる。
  vocab:
    - {term: "sampling", gloss: "標本抽出"}
- id: 37
  status: draft
  ja: |
    流動化（第¿sec:drifting?節）
  point: |
