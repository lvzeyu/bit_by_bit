- id: 58
  status: draft
  ja: |
    最後に、Jon Kleinberg と同僚たちは（2015年）、予測問題が微妙に異なる二つのカテゴリーに分類されることを指摘し、社会学者が片方のカテゴリーに焦点を当て、もう一方を無視しがちであることを述べている。Annaという政策決定者は旱魃に直面しており、雨を増やすためにシャーマンに踊らせるかどうかを決める必要がある。一方、Bettyという政策決定者は帰りの道で濡れないように傘を持参するかどうかを決める必要がある。両者とも天候を理解することでより良い決定を下すことができるが、必要な情報は異なる。Annaは雨踊りが雨を引き起こすかどうかを理解する必要がある。一方、Bettyは因果関係を理解する必要はなく、正確な予報さえあればよい。社会研究者はAnnaのような問題——Kleinbergらはこれを「雨踊りのような」政策問題と呼ぶ——に焦点を当てることが多く、これは因果関係に関する質問を含んでいるためである。Bettyのような問題——Kleinbergらはこれを「傘のような」政策問題と呼ぶ——も非常に重要であるが、社会研究者の注目はそれほど多くない。
  point: |
    社会学者は因果関係を扱う「雨踊りのような」政策問題に注目し、「傘のような」政策問題はあまり注目されていない。
  vocab:
    - {term: "forecasting", gloss: "予測"}
- id: 59
  status: draft
  ja: |
    近似実験（第2.4.3節）
  point: |
    第2.4.3節「実験の近似」に関する追加文献の見出しである。
- id: 60
  status: draft
  ja: |
    P.S. 政治科学誌では大規模データ、因果推論、形式理論に関するシンポジウムが開催され、Clark と Golder (2015) が各寄稿を要約している。アメリカ合衆国国立科学院紀要誌でも因果推論と大規模データに関するシンポジウムが開催され、Shiffrin (2016) が各寄稿を要約している。大規模データソース内で自然実験を自動的に発見しようとする機械学習アプローチについては、Jensen ら (2008)、Sharma, Hofman, および Watts (2015)、Sharma, Hofman, および Watts (2016) を参照のこと。
  point: |
    大規模データと因果推論に関する複数のシンポジウムと関連文献が紹介されている。
    「因果推論」はある働きかけが結果を変えたかを推定することである。
  vocab:
    - {term: "causal inference", gloss: "因果推論"}
    - {term: "natural experiments", gloss: "自然実験"}
    - {term: "machine learning", gloss: "機械学習"}
- id: 61
  status: draft
  ja: |
    自然実験に関しては、Dunning（2012）が多くの例を挙げた入門的な書籍を提供している。自然実験に対する懐疑的な見方については、経済学のRosenzweigとWolpin（2000）や政治学のSekhonとTitiunik（2012）を参照されたい。Deaton（2010）とHeckmanおよびUrzúa（2010）は、自然実験に焦点を当てる研究者が重要でない因果効果の推定に集中する可能性があると主張している。これに対してImbens（2010）は、自然実験の価値に対するより楽観的な見方を提示している。
  point: |
    自然実験の価値と限界について異なる見解が存在する。
    「自然実験」は研究者以外が生んだ偶然に近い条件差を利用する研究である。
  vocab:
    - {term: "natural experiments", gloss: "自然実験"}
- id: 62
  status: draft
  ja: |
    研究者が徴兵の影響から兵役の影響を推定する方法を説明する際、私が述べた手法は、インストルメンタル変数と呼ばれる技術です。ImbensとRubin（2015）は、第23章と第24章で導入を行い、徴兵抽選を例としています。インストルメンタル変数が使用される場合、コンプライアーにおける兵役の影響は、しばしばコンプライアー平均因果効果（CACE）または局所平均処置効果（LATE）と呼ばれます。SoveyとGreen（2011）、AngristとKrueger（2001）、Bollen（2012）は、政治学、経済学、社会学におけるインストルメンタル変数の使用についてレビューを提供し、SoveyとGreen（2011）はインストルメンタル変数を使用した研究を評価するための「読者のチェックリスト」を提供しています。
  point: |
    インストルメンタル変数の使用と評価に関するレビューとチェックリストが提供されている。
  vocab:
    - {term: "complier average causal effect", gloss: "遵守者平均因果効果（CACE）"}
    - {term: "average treatment effect", gloss: "平均処置効果（ATE）"}
    - {term: "instrumental variables", gloss: "操作変数"}
- id: 63
  status: draft
  ja: |
    実際、1970年の抽選は完全にランダム化されたわけではなく、純粋なランダム性から小さな逸脱があったことが分かった（Fienberg 1971）。BerinskyとChatfield（2015）は、この小さな逸脱が実質的には重要ではないと主張し、適切に実施されたランダム化の重要性について議論している。
  point: |
    1970年の抽選は完全にランダムではなかったが、その逸脱は実質的には重要ではないとされる。
  vocab:
    - {term: "randomization", gloss: "無作為化"}
- id: 64
  status: draft
  ja: |
    マッチングに関しては、Stuart (2010) が楽観的なレビューを提供し、Sekhon (2009) が悲観的なレビューを提供している。マッチングが一種の剪定であるという点については、Ho et al. (2007) を参照のこと。個々の人に完全なマッチを見つけることはしばしば困難であり、これが複数の複雑さを引き起こす。まず、正確なマッチが利用できない場合、研究者は二つの単位間の距離をどのように測定するか、そして特定の距離が十分に近いかどうかを決定する必要がある。処置群の各事例に対して複数のマッチを使用したい場合、これはより正確な推定をもたらす可能性があるため、さらなる複雑さが生じる。これらの問題の詳細は、Imbens and Rubin (2015) の第18章で詳しく説明されている。また、(???) の第2部も参照のこと。
  point: |
    マッチングの難しさと複雑さ、特に完全なマッチの見つけにくさと複数マッチ使用の問題が述べられている。
    「マッチング」は観測できる特徴が似た対象どうしを比べる方法である。
  vocab:
    - {term: "treatment group", gloss: "処置群"}
- id: 65
  status: draft
  ja: |
    デヘジアとワハバ（1999）では、マッチング手法がランダム化制御試験と同様の推定値を生成できた例が示されています。しかし、アルセノー、ガーバー、グリーン（2006）およびアルセノー、ガーバー、グリーン（2010）では、マッチング手法が実験の基準を再現できなかった例が示されています。
  point: |
    マッチング手法がランダム化制御試験の結果を再現できる場合とできない場合がある。
    「マッチング」は観測できる特徴が似た対象どうしを比べる方法である。
  vocab:
    - {term: "randomized controlled experiment", gloss: "無作為化比較実験"}
    - {term: "benchmark", gloss: "比較基準"}
- id: 66
