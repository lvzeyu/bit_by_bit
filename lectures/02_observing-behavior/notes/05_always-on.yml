# 2.3.2 Always-on
# 原文: https://www.bitbybitbook.com/en/1st-ed/observing-behavior/characteristics/always-on/
# 每段一条,id 对应页面上的段落编号。status: todo / draft / reviewed
# 可选字段(按需添加): vocab([{term, gloss}])、syntax、background
blocks: 8   # 原文段落数,build 时校验
paragraphs:
- id: 1
  status: draft
  ja: |
    常時接続の大データは、予期しない出来事の研究とリアルタイム測定を可能にする。
  point: |
    常時接続の大データが予期しない出来事の研究とリアルタイム測定を可能にすること
  vocab:
    - {term: "always-on", gloss: "常時稼働の"}
    - {term: "real-time", gloss: "リアルタイムの"}
- id: 2
  status: draft
  ja: |
    多くのビッグデータシステムは常に稼働しており、データを連続して収集し続けます。この常時稼働という特性は、研究者に時系列データを提供し、研究には二つの重要な意味があります。
  point: |
    常時稼働するビッグデータシステムは研究者に時系列データを提供し、研究に二つの重要な意味を持ちます。
    「常時稼働」は継続的にデータを記録できる性質を指す。
  vocab:
    - {term: "always-on", gloss: "常時稼働の"}
- id: 3
  status: draft
  ja: |
    まず、常にデータ収集が行われることにより、研究者はそれ以外では不可能な方法で予期しない出来事を研究することが可能になります。例えば、2013年の夏にトルコで発生した占拠ゲジ抗議行動を研究しようとする研究者は通常、抗議者の行動に焦点を当てます。Ceren BudakとDuncan Watts（2015）は、Twitterの常にオンの性質を利用して、抗議行動の前後も含めてTwitterを使用した抗議者の行動を研究することで、より多くのことを成し遂げました。そして、彼らは抗議行動の前後も含めて参加者でない人々のグループを作り出すことができました（図2.2）。全体として、彼らの事後パネルには2年間にわたる3万人のツイートが含まれていました。この他の情報を通常使用される抗議行動のデータに追加することにより、BudakとWattsは多くのことを学ぶことができました：彼らはゲジ抗議行動に参加する可能性が高い人々の種類を推定し、また短期間（ゲジ前とゲジ中）と長期間（ゲジ前とゲジ後）における参加者と非参加者の態度の変化を推定することができました。
  point: |
    常にデータ収集が行われることにより、Ceren BudakとDuncan Wattsは、占拠ゲジ抗議行動の前後も含めて参加者と非参加者の行動と態度の変化を詳細に研究することができた。
  vocab:
    - {term: "data collection", gloss: "データ収集"}
- id: 4
  status: draft
  ja: |
    図2.2：BudakとWatts（2015）が2013年夏のトルコのGezi公園抗議運動を研究するために使用した設計。Twitterの常時接続性を利用することで、研究者は約3万人の参加者を2年間にわたる「事後パネル」と呼ぶものを構築した。一般的な研究では抗議中の参加者に焦点を当てているのに対し、事後パネルは1) イベント前後の人々のデータと2) イベント前後における非参加者のデータを追加する。この豊富なデータ構造により、BudakとWattsはGezi公園抗議運動に参加しやすい人々の特徴を推定し、参加者と非参加者の態度の短期的（Gezi前とGezi中）および長期的（Gezi前とGezi後）な変化を推定することが可能となった。
  point: |
    BudakとWattsが2013年のGezi公園抗議運動を研究するために、Twitterの常時接続性を利用して約3万人の参加者を2年間にわたる「事後パネル」を作成し、参加者と非参加者の態度の短期的および長期的な変化を推定した。
- id: 5
  status: draft
  ja: |
    懐疑論者は、これらの推定のいくつかは常にデータ収集源なしでも行うことができた（例えば、長期的な態度変化の推定）と指摘するかもしれないが、それは正しいが、3万人に対してそのようなデータ収集を行うのは非常に高価だったであろう。しかし予算に制限がない場合でも、研究者が過去に戻り、直接参加者の過去の行動を観察できる他の方法は思いつかない。最も近い代替案は行動の回顧的報告を集める方法だが、その報告は粒度が粗く、信頼性に欠けるだろう。表2.1は、予期せぬ出来事を研究するために常にオンのデータ源を使用する他の研究例を提供している。
  point: |
    常にオンのデータ収集源が過去の行動を直接観察できる唯一の方法であり、他の方法は粒度が粗く信頼性に欠ける。
  vocab:
    - {term: "retrospective", gloss: "過去をさかのぼる・回顧的な"}
- id: 6
  status: draft
  ja: |
    表2.1: 予期しない出来事を使用して収集された大規模な常時データソースからの研究。
    予期しない出来事
    常時データソース
    引用
    トルコのジゼ公園占拠運動
    Twitter
    Budak and Watts (2015)
    香港の Umbrella 訴求運動
    Weibo
    Zhang (2016)
    ニューヨーク市での警察射殺事件
    Stop-and-frisk 報告
    Legewie (2016)
    ISIS 加入者
    Twitter
    Magdy, Darwish, and Weber (2016)
    2001年9月11日の攻撃
    livejournal.com
    Cohn, Mehl, and Pennebaker (2004)
    2001年9月11日の攻撃
    pager メッセージ
    Back, Küfner, and Egloff (2010), Pury (2011), Back, Küfner, and Egloff (2011)
  point: |
    表2.1は、トルコのジゼ公園占拠運動から2001年9月11日の攻撃までの様々な予期しない出来事に関する研究を、それぞれの常時データソースとともに示している
  vocab:
    - {term: "pager", gloss: "ポケベル"}
- id: 7
  status: draft
  ja: |
    常にオンのビッグデータシステムは、予期しない出来事を研究するだけでなく、政策立案者が状況認識に基づいて対応する必要がある場合に重要なリアルタイムの推定を生み出すことが可能である。例えば、ソーシャルメディアデータは自然災害への緊急対応をガイドするのに使用され（Castillo 2016）、様々なビッグデータ源は経済活動のリアルタイムの推定を生み出すのに使用される（Choi and Varian 2012）。
  point: |
    常にオンのビッグデータシステムは、リアルタイムの推定を生み出し、政策立案者の状況認識を支援する。
  vocab:
    - {term: "real-time", gloss: "リアルタイムの"}
- id: 8
  status: draft
  ja: |
    結論として、オンデマンドデータシステムは予期しない出来事を研究し、政策立案者にリアルタイム情報を提供できるが、長期的な変化を追跡するには適していないと考える。それは多くのビッグデータシステムが常に変化しており、その過程を後述する（第2.3.7節）「ドリフト」と呼ぶからである。
  point: |
    オンデマンドデータシステムは予期しない出来事の研究とリアルタイム情報提供に適しているが、長期的な変化の追跡には不適切である
  vocab:
    - {term: "drift", gloss: "経時的なずれ"}
