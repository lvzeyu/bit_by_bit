# 2.3.8 Algorithmically confounded
# 原文: https://www.bitbybitbook.com/en/1st-ed/observing-behavior/characteristics/algorithmically-confounded/
# 每段一条,id 对应页面上的段落编号。status: todo / draft / reviewed
# 可选字段(按需添加): vocab([{term, gloss}])、syntax、background
blocks: 7   # 原文段落数,build 时校验
paragraphs:
- id: 1
  status: draft
  ja: |
    ビッグデータシステムにおける行動は自然ではなく、システムのエンジニアリング目標によって駆動されている
  point: |
    「アルゴリズム的交絡」とは、システムの設計や推薦機能が観測される行動に影響することである。したがって、ビッグデータ上の行動を自然な行動とみなすことはできない。
- id: 2
  status: draft
  ja: |
    多くの大規模データ源が人々がデータが記録されていることに気づかない非反応型である（第2.3.3節参照）ため、研究者はこれらのオンラインシステムでの行動を「自然発生的」と考えるべきではない。実際、行動を記録するデジタルシステムは、広告をクリックしたりコンテンツを投稿したりする特定の行動を誘導するために高度に設計されている。システム設計者の目標がデータにパターンを導入する方法をアルゴリズム的交絡と呼ぶが、これは社会科学者にはあまり知られていないが、慎重なデータサイエンティストにとっては大きな懸念であり、デジタル痕跡の他の問題とは異なり、アルゴリズム的交絡はほとんど見えないものである。
  point: |
    デジタルシステムは特定の行動を誘導する。「アルゴリズム的交絡」は、その設計上の誘導が観測データに混ざり、人間自身の行動と区別しにくくなる問題である。
  vocab:
    - {term: "algorithmic confounding", gloss: "アルゴリズム的交絡"}
    - {term: "digital traces", gloss: "デジタル痕跡"}
    - {term: "nonreactive", gloss: "非反応的な"}
- id: 3
  status: draft
  ja: |
    Facebookでは、Johan Uganderらの研究（2011）により、約20人の友人がいるユーザーが異常に多いことが明らかになった。科学者がFacebookの仕組みを理解せずにこのデータを分析すると、20という数字が何か特別な社会的意味を持つと誤った解釈を下す可能性がある。しかし、UganderらはFacebookのデータ生成プロセスを深く理解しており、新規ユーザーがアクティブになるよう20人までの友人を作るように促すポリシーがあったことを知っていた。このポリシーを知らなければ、データから誤った結論を導きやすい。つまり、約20人の友人がいるユーザーの割合が高いことは、人間の行動よりもFacebookの特性を反映している。
  point: |
    約20人の友人を持つ利用者が多いのは、Facebookが新規利用者に友人を20人まで追加するよう促していたためである。これは「アルゴリズム的交絡」の例である。
  vocab:
    - {term: "algorithmic confounding", gloss: "アルゴリズム的交絡"}
- id: 4
  status: draft
  ja: |
    この前の例では、アルゴリズム的交絡が奇妙な結果を生み出し、慎重な研究者が検出・調査する可能性があることが示された。しかし、オンラインシステムの設計者が社会理論を知り、その理論をシステムの動作に組み込む場合、アルゴリズム的交絡のより厄介なバージョンが発生する。社会学者はこれをパフォーマティビティと呼んでおり、理論が世界を変えて理論に沿った形に世界をより近づける状況を指す。パフォーマティブなアルゴリズム的交絡の場合、データの交絡の性質は非常に検出が困難である。
  point: |
    「遂行性」は理論や指標が対象の現実を変えることを指す。社会理論をシステムの設計に組み込むと、観測された行動と設計の影響を区別しにくくなる。
  vocab:
    - {term: "performativity", gloss: "遂行性"}
- id: 5
  status: draft
  ja: |
    オンラインソーシャルネットワークにおけるパフォーマティビティの一例として、トランスイタビリティのパターンが挙げられます。1970年代と1980年代に研究者は繰り返し発見しましたが、あなたがAliceとBobの両方と友人であれば、AliceとBobが互いに友人である可能性は、ランダムに選ばれた2人の人々よりも高いというパターンが、Facebookのソーシャルグラフでも同様に確認されました（Ugander et al. 2011）。したがって、Facebook上の友人関係のパターンは少なくともトランスイタビリティに関してオフラインの友人関係のパターンを反映していると結論付けることができます。しかし、Facebookのソーシャルグラフにおけるトランスイタビリティの大きさは一部、アルゴリズム的交絡によって引き起こされています。つまり、Facebookのデータサイエンティストたちはトランスイタビリティに関する経験的および理論的研究を知り、それをFacebookの仕組みに組み込みました。Facebookには「People You May Know」という機能があり、新しい友人を提案します。Facebookがあなたに誰を提案するかを決定する方法の一つはトランスイタビリティであり、つまりFacebookはあなたの友人の友人になることを提案する可能性が高いです。この機能はFacebookのソーシャルグラフにおけるトランスイタビリティを増加させる効果があります；言い換えれば、トランスイタビリティの理論がその予測通りの世界を生み出しています（Zignani et al. 2014; Healy 2015）。したがって、ビッグデータソースが社会理論の予測を再現しているように見える場合、その理論自体がシステムの仕組みに組み込まれていたかどうかを確認する必要があります。
  point: |
    「推移性」は友人の友人ともつながりやすい傾向を指す。Facebookの友人推薦はその傾向を強めるため、観測された関係を人間の性質だけに帰せない。
  vocab:
    - {term: "transitivity", gloss: "推移性"}
- id: 6
  status: draft
  ja: |
    ビッグデータの源を自然な状況で人々を観察するものと考えるのではなく、カジノで人々を観察するというより適切な比喩がある。カジノは特定の行動を誘発するために設計されたエンジニアリングされた環境であり、研究者はカジノでの行動が人間の行動を無制限に反映することを期待しない。もちろん、カジノで人々を研究することで人間の行動について何かを学ぶことはできるが、データがカジノで生成されているという事実を無視すると、誤った結論を導き出す可能性がある。
  point: |
    ビッグデータはエンジニアリングされた環境で生成されるため、そのデータから得られる結論には注意が必要である
- id: 7
  status: draft
  ja: |
    オンラインシステムの多くの要素が特許取得済み、記述が不十分であり、常に変化しているため、アルゴリズム的混同に対処することは特に困難であり、例えば、後述するように（第2.4.2節）、グーグル・フリュー・トレンドの徐々な崩壊の原因としてアルゴリズム的混同が考えられたが、グーグルの検索アルゴリズムの内部構造が特許取得済みであるため、この主張を評価することは難しかった。アルゴリズム的混同の動的な性質はシステムのずれの一形態であり、単一のデジタルシステムから得られる人間の行動に関するいかなる主張についても慎重であるべきである。
  point: |
    アルゴリズム的混同により、人間の行動に関するデジタルシステムからの主張は慎重に評価すべきである。
  vocab:
    - {term: "Google Flu Trends", gloss: "Googleインフルトレンド"}
    - {term: "system drift", gloss: "システムの経時変化"}
