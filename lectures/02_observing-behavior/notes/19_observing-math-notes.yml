  point: |
    観測結果の表が、人物ごとの処置条件と対照条件での収入、および処置効果を示している
- id: 22
  status: draft
  ja: |
    自然実験
  point: |
    自然実験が取り上げられている
- id: 23
  status: draft
  ja: |
    因果推定を行うために実験を実施せずに自然に処置がランダムに割り当てられるような状況を探す方法があり、これを自然実験という。しかし、多くの場合、自然は関心のある人口に対して望む処置をランダムに提供しない。しかし、ときには自然は関連する処置をランダムに提供することがある。特に、二次的な処置が人々に一次的な処置を受けることを促す場合を考える。例えば、徴兵は兵役に就く一次的な処置を受けることを促すランダムに割り当てられた二次的な処置と考えることができる。この設計はしばしば奨励デザインと呼ばれる。そして私が説明するこの状況を扱う分析手法はしばしば操作変数と呼ばれる。この設定では、いくつかの仮定のもと、研究者はこの奨励を用いて特定のユニットのサブセットに対する一次的な処置の効果を学ぶことができる。
  point: |
    自然実験と奨励デザイン、操作変数分析法について説明している。
- id: 24
  status: draft
  ja: |
    二つの異なる処置、すなわち奨励と主要な処置に対処するために、新しい表記法が必要です。一部の人々がランダムに召集される（\(Z_i = 1\)）か召集されない（\(Z_i = 0\)）場合があり、この状況では\(Z_i\)は時として装置と呼ばれます。
  point: |
    ランダムに召集されるかどうかを表す新たな表記法が必要である。
- id: 25
  status: draft
  ja: |
    徴兵された人々の中には兵役に就いた者（\(Z_i = 1, W_i = 1\)）と兵役に就かなかった者（\(Z_i = 1, W_i = 0\)）がおり、徴兵されなかった人々の中には兵役に就いた者（\(Z_i = 0, W_i = 1\)）と兵役に就かなかった者（\(Z_i = 0, W_i = 0\)）がいる。各個人の潜在的な結果は、奨励と処置の両方の状態を示すことができる。例えば、\(Y(1, W_i(1))\)は、徴兵された場合の人物\(i\)の収入であり、\(W_i(1)\)は徴兵された場合のその人物の兵役状況を示す。さらに、人口をコンプライアー、ネバー・テイカー、デファイア、オールウェイズ・テイカーという4つのグループに分割することができる（表2.7）。
  point: |
    徴兵と兵役の組み合わせにより、人口をコンプライアー、ネバー・テイカー、デファイア、オールウェイズ・テイカーの4つのグループに分割できる。
- id: 26
  status: draft
  ja: |
    表2.7：4つのタイプの人々
    タイプ
    徴兵された場合のサービス
    徴兵されなかった場合のサービス
    コンプライアー
    はい、\(W_i(Z_i=1) = 1\)
    いいえ、\(W_i(Z_i=0) = 0\)
    未承者
    いいえ、\(W_i(Z_i=1) = 0\)
    いいえ、\(W_i(Z_i=0) = 0\)
    逆承者
    いいえ、\(W_i(Z_i=1) = 0\)
    はい、\(W_i(Z_i=0) = 1\)
    恒承者
    はい、\(W_i(Z_i=1) = 1\)
    はい、\(W_i(Z_i=0) = 1\)
  point: |
    表は、徴兵された場合とされなかった場合の4つの異なるタイプの人の行動を示している。
- id: 27
  status: draft
  ja: |
    処置効果（すなわち兵役）を推定する前に、まず奨励（すなわち徴兵されるという事実）の二つの効果を定義することができます。第一に、奨励が主要な処置に及ぼす効果を定義することができます。第二に、奨励が結果に及ぼす効果を定義することができます。これらの二つの効果は組み合わされて、特定の人々のグループに対する処置効果の推定を提供することができます。
  point: |
    奨励の二つの効果を組み合わせて特定の人々に対する処置効果を推定することができる。
- id: 28
  status: draft
  ja: |
    まず、奨励の処置への影響は、個人\(i\)に対して次のように定義できる。
  point: |
    奨励が処置に及ぼす影響を個人ごとに定義する。
- id: 29
  status: draft
  ja: |
    個体効果尺度のITTは、\[ \text{ITT}_{W,i} = W_i(1) - W_i(0) \qquad(2.5)\]で表される。
  point: |
    個体効果尺度のITTは\[ \text{ITT}_{W,i} = W_i(1) - W_i(0)\]で定義される。
- id: 30
  status: draft
  ja: |
    さらに、この量は全体の人口に対して定義される。
  point: |
    この量は全体の人口に対して定義される。
- id: 31
  status: draft
  ja: |
    個体レベルの処置効果は、\[ W_i(1) - W_i(0) \]で表され、全体の処置効果ITT_Wは、\[ \text{ITT}_{W} = \frac{1}{N} \sum_{i=1}^N [W_i(1) - W_i(0)] \]により計算される。
  point: |
    ITT_Wは、全個体の処置効果の平均値として定義される。
- id: 32
  status: draft
  ja: |
    最後に、データを使用して\(\text{ITT} _{W}\)を推定することができます。
  point: |
    データを使用して\(\text{ITT} _{W}\)を推定する。
- id: 33
  status: draft
  ja: |
    \[ \widehat{\text{ITT}_{W}} = \bar{W}^{\text{obs}}_1 - \bar{W}^{\text{obs}}_0 \qquad(2.7)\]
  point: |
    ITT_Wの推定量は、処置割当群と対照割当群における処置受領率の観測平均の差である。
- id: 34
  status: draft
  ja: |
    \(\bar{W}^{\text{obs}}_1\) は奨励された人々の処置率であり、\(\bar{W}^{\text{obs}}_0\) は奨励されなかった人々の処置率である。\(\text{ITT}_W\) はまた、処置受領率とも呼ばれることがある。
  point: |
    \(\text{ITT}_W\) は処置の処置受領率を示す。
- id: 35
  status: draft
  ja: |
    次に、奨励の結果に対する影響は、個人\(i\)に対して定義できる。
  point: |
    個人\(i\)に対する奨励の結果への影響を定義する。
- id: 36
  status: draft
  ja: |
    \[ \text{ITT}_{Y,i} = Y_i(1, W_i(1)) - Y_i(0, W_i(0)) \qquad(2.8)\]
  point: |
    個体効果の総和を表す式が与えられている。
- id: 37
  status: draft
  ja: |
    さらに、この量は全体の人口に対して定義される。
  point: |
    この量は全体の人口に対して定義される。
- id: 38
  status: draft
  ja: |
    \[ITT_Y = \frac{1}{N} \sum_{i=1}^N [Y_i(1, W_i(1)) - Y_i(0, W_i(0))]\qquad(2.9)\]
  point: |
    個人 i に対するITT_Yは、処置への割当時と対照への割当時に実現する結果の差として定義される。
- id: 39
  status: draft
  ja: |
    最後に、データを使用して\(\text{ITT}_{Y}\)を推定することができます。
  point: |
    データを使用して\(\text{ITT}_{Y}\)を推定することができる。
- id: 40
  status: draft
  ja: |
    \[ \widehat{\text{ITT}_{Y}} = \bar{Y}^{\text{obs}}_1 - \bar{Y}^{\text{obs}}_0 \qquad(2.10)\]
  point: |
    介入群と対照群の観測値の平均差が効果量を推定する。
- id: 41
  status: draft
  ja: |
    ここで、\(\bar{Y}^{\text{obs}}_1\) は、奨励（例えば、召集）を受けた人々の観測された結果（例えば、収入）であり、\(\bar{W}^{\text{obs}}_0\) は奨励を受けなかった人々の観測された結果である。
  point: |
    奨励を受けた人々と受けなかった人々の観測された結果が示されている。
- id: 42
  status: draft
  ja: |
    最後に、主要な処置（例えば兵役）が結果（例えば収入）に及ぼす影響について考察します。残念ながら、一般的にはすべての単位に対するこの影響を推定することはできません。しかし、いくつかの仮定のもとでは、研究者は処置の影響をコンプライアー（つまり、徴兵されれば兵役に就き、徴兵されなければ兵役に就きない人々、表2.7参照）に対して推定することができます。この推定量をコンプライアーの平均因果効果（CACE）と呼びます（これはまた局所平均処置効果（LATE）とも呼ばれます）。
  point: |
    主要な処置の影響をすべての単位に対して推定することはできないが、コンプライアーに対しては推定可能であり、これをコンプライアーの平均因果効果（CACE）と呼ぶ。
- id: 43
  status: draft
  ja: |
    \[ \text{CACE} = \frac{1}{N_{\text{co}}} \sum_{i:G_i=\text{co}} [Y(1, W_i(1)) - Y(0, W_i(0))] \qquad(2.11)\]
  point: |
    CACEは、コンプライアー（割当に従う人々）における平均因果効果として定義される。
- id: 44
  status: draft
  ja: |
    \(G_i\) は人 \(i\) の所属するグループを表し（表2.7参照）、\(N_{\text{co}}\) はコンプライアーの数を表す。言い換えると、式2.11は、徴兵された場合とされなかった場合のコンプライアーの収入を比較している。式2.11の推定対象は、観測データから容易に推定するのが難しいと思われる。なぜなら、観測データのみではコンプライアーを特定することはできないからである（コンプライアーかどうかを知るためには、その人が徴兵されたときに兵役に就いたか、徴兵されなかったときに兵役に就いたかを観察する必要がある）。
  point: |
    式2.11はコンプライアーの収入を比較するが、観測データのみではコンプライアーを特定できないため推定が難しい。
- id: 45
  status: draft
  ja: |
    実際には少し意外ですが、もし何らかのコンプライアー（complier）が存在すれば、さらに3つの追加的な仮定を導入することにより、観測データからCACE（コンプライアー平均因果効果）を推定することが可能です。まず、処置への割り当てがランダムであるという仮定が必要です。特に徴兵抽選の場合、この仮定は妥当ですが、物理的なランダム化に頼らない自然実験では問題となる可能性があります。次に、デファイア（defier）が存在しないという仮定が必要です。徴兵の文脈では、徴兵されれば兵役に就かず、徴兵されなければ兵役に就く人々が非常に少ないという仮定は合理的です。最後に最も重要な仮定が除外制約（exclusion restriction）です。除外制約の下では、処置の割り当てによる影響は処置自体を通じてのみ発生すると仮定します。つまり、奨励そのものが結果に直接影響を与えないという仮定が必要です。例えば、徴兵抽選の場合、徴兵ステータスが兵役を通じて以外の方法で収入に影響を与えないという仮定が必要です（図2.11）。除外制約は、例えば、徴兵された人々が学校に長く通って兵役を避けるために時間を使ったり、雇用主が徴兵された人々を雇う可能性が低い場合など、違反される可能性があります。
  point: |
    コンプライアー平均因果効果を推定するためには、処置の割り当てがランダムで、デファイアが存在せず、除外制約が成立するという3つの仮定が必要である。
- id: 46
  status: draft
  ja: |
    図2.11：除外制約とは、奨励（抽選による召集）が結果（収入）に影響を与えるのは、処置（兵役）を通じてのみであるという要件である。例えば、召集された人が兵役を避けるために学校に長く通い、その結果収入が増加した場合、除外制約が破られる可能性がある。
  point: |
    除外制約とは、奨励が結果に影響を与えるのは処置を通じてのみであるという要件であり、これが破られる可能性がある。
- id: 47
  status: draft
  ja: |
    これらの3つの条件（処置へのランダム割り当て、逆者なし、および除外制限）が満たされた場合、
  point: |
    これらの3つの条件が満たされれば
- id: 48
  status: draft
  ja: |
    \[ \text{CACE} = \frac{\text{ITT}_Y}{\text{ITT}_W} \qquad(2.12)\]
  point: |
    CACEはITT_YとITT_Wの比で定義される。
- id: 49
  status: draft
  ja: |
    したがって、私たちはCACEを推定することができます。
  point: |
    CACEを推定することが可能である。
- id: 50
  status: draft
  ja: |
    \[ \widehat{\text{CACE}} = \frac{\widehat{\text{ITT}_Y}}{\widehat{\text{ITT}_W}} \qquad(2.13)\]
  point: |
    CACEはITT_Yの推定値をITT_Wの推定値で割ったものと定義される。
- id: 51
  status: draft
  ja: |
    CACEは、奨励された人々と奨励されなかった人々の結果の差を、処置受領率で拡大したものを指すと考えることができます。
  point: |
    CACEは、奨励された人々と奨励されなかった人々の結果の差を、処置受領率で拡大したものです。
- id: 52
  status: draft
  ja: |
    二つの重要な注意点があります。第一に、除外制限は強い仮定であり、個々のケースごとに正当化する必要があります。これはしばしば専門分野の知識を必要とします。また、除外制限は奨励のランダム化によって正当化することはできません。第二に、操作変数分析における一般的な実務上の課題の一つは、奨励が処置の採用にほとんど影響を与えない場合（\(\text{ITT}_W\)が小さい場合）です。これを弱い道具と呼び、これが様々な問題を引き起こします（Imbens and Rosenbaum 2005; Murray 2006）。弱い道具の問題を理解する一つの方法は、\(\widehat{\text{ITT}_Y}\)の小さなバイアスが\(\widehat{\text{ITT}_W}\)が小さいために拡大され、結果として\(\widehat{\text{CACE}}\)が敏感になることです。つまり、自然が割り当てる処置が気にしている処置に大きな影響を与えない場合、気にしている処置について学ぶのは難しいということです。
  point: |
    除外制限の正当化と弱い道具による問題が指摘されている。
- id: 53
  status: draft
  ja: |
    第23章と24章を参照してください（Imbens and Rubin, 2015）。伝統的な計量経済学における道具変数法は、潜在的結果ではなく推定方程式の観点から表現されることが一般的です。異なる視点からの導入については、Angrist and Pischke (2009)を参照してください。両者の方法を比較するには、Imbens and Rubin (2015)の第24.6節を参照してください。Gerber and Green (2012)の第6章では、やや形式性が低い道具変数法の説明が提供されています。除外制約についてさらに詳しく知りたい場合は、D. Jones (2015)を参照してください。Aronow and Carnegie (2013)は、ATEを推定するために使用できる追加の仮定セットを説明しています。自然実験が解釈するのが非常に難しい場合があることは、Sekhon and Titiunik (2012)で詳しく説明されています。より一般的な自然実験の導入については、回帰不連続デザインなど、単なる道具変数法を超えたアプローチも含むDunning (2012)を参照してください。
  point: |
    伝統的な計量経済学における道具変数法の解説と比較、自然実験の解釈の難しさ、さらには広範な自然実験のアプローチについての文献が紹介されている。
