paragraphs:
- id: 1
  status: draft
  ja: |
    この付録では、非実験データから因果推論を行うためのいくつかのアイデアをやや数学的な形式でまとめます。主なアプローチは2つあり、一つはジュデア・ペアルと同僚たちが主に関連付けられている因果グラフフレームワーク、もう一つはドナルド・ルビンと同僚たちが主に関連付けられている潜在結果フレームワークです。私は数学的なノートが第3章と第4章の終わりにあるアイデアとより密接に関連しているため、潜在結果フレームワークを紹介します。因果グラフフレームワークについてさらに詳しく知りたい場合は、ペアル、グリーモア、ジュエル（2016）（入門）とペアル（2009）（高度）を推奨します。潜在結果フレームワークと因果グラフフレームワークを組み合わせた因果推論に関する本格的な取り組みについては、モーガンとウィンシップ（2014）を推奨します。
  point: |
    非実験データからの因果推論の2つの主要アプローチとそれぞれの代表的な文献を紹介する。
- id: 2
  status: draft
  ja: |
    この付録の目的は、潜在的結果アプローチの表記法とスタイルに慣れ親しんでもらい、このトピックに関するより技術的な資料に移行できるようにすることである。まず、潜在結果フレームワークを説明し、次にAngrist (1990)による兵役が収入に及ぼす影響に関する自然実験のようなものをさらに議論する。この付録はImbens and Rubin (2015)に大きく依存している。
  point: |
    潜在的結果アプローチの表記法とスタイルに慣れ、Angrist (1990)の自然実験を用いた兵役の収入への影響の議論を行う付録で、Imbens and Rubin (2015)に多く依拠している。
- id: 3
  status: draft
  ja: |
    潜在的結果枠組み
  point: |
    潜在的結果枠組みが主題である
- id: 4
  status: draft
  ja: |
    潜在結果枠組みには単位、処置、潜在結果の3つの主要要素がある。アングリスト（1990）が取り扱った問題を簡略化して考えてみよう。軍務が収入に及ぼす影響とは何か。この場合、単位は1970年の徴兵に適格だった米国人と定義でき、これらの人々を\(i = 1, \ldots, N\)でインデックス化できる。処置は「軍務に就く」または「軍務に就かない」であり、前者を処置条件、後者を対照条件と呼ぶ。処置条件の場合は\(W_i = 1\)、対照条件の場合は\(W_i = 0\)とする。最後に、潜在結果は「潜在」結果を含むため概念的に難しく、各1970年徴兵適格者は軍務に就いた場合と就かなかった場合の1978年の収入額をそれぞれ\(Y_i(1)\)と\(Y_i(0)\)と定義できる。潜在結果枠組みでは、\(Y_i(1)\)と\(Y_i(0)\)は固定量と見なし、\(W_i\)はランダム変数である。
  point: |
    潜在結果枠組みは単位、処置、潜在結果から構成され、1970年徴兵適格者の1978年の収入額を軍務に就いた場合と就かなかった場合の2つの潜在結果として定義する。
- id: 5
  status: draft
  ja: |
    単位、処置、結果の選択は重要である理由は、それが研究から何が学べるか、また学べないかを定義するからである。単位の選択—1970年の徴兵に適格だった人々—には女性は含まれていないため、追加の仮定がない限り、この研究は軍務が女性に及ぼす影響について何も教えてくれないであろう。処置と結果をどのように定義するかについての決定も重要である。例えば、関心のある処置は軍務に従事することなのか、または戦闘を経験することなのか、関心のある結果は収入なのか、または仕事の満足度なのか、といった問いがある。最終的には、単位、処置、結果の選択は、研究の科学的および政策的目的によって駆動されるべきである。
  point: |
    単位、処置、結果の選択は研究の目的を定義し、その選択は科学的および政策的目的によって駆動されるべきである。
- id: 6
  status: draft
  ja: |
    与えられた単位、処置、および潜在的な結果の選択肢を考えると、処置による個人\(i\)への因果効果\(\tau_i\)は
  point: |
    因果効果\(\tau_i\)は与えられた条件下での処置による個人への影響である
- id: 7
  status: draft
  ja: |
    \[ \tau_i = Y_i(1) - Y_i(0) \qquad(2.1)\]
  point: |
    処置効果\(\tau_i\)は、個体\(i\)に対する処置の有無によって生じる差\(Y_i(1) - Y_i(0)\)を表す。
- id: 8
  status: draft
  ja: |
    言い換えると、私たちは人物\(i\)が兵役に就いた場合と兵役に就かなかった場合の収入を比較します。私にとって、式2.1は因果効果を定義する最も明確な方法であり、非常にシンプルながらこのフレームワークは重要な多くの面で汎用性があることがわかりました（Imbens and Rubin 2015）。
  point: |
    式2.1は因果効果を定義する最も明確な方法であり、そのフレームワークは汎用性がある
- id: 9
  status: draft
  ja: |
    潜在的結果フレームワークを使用する際には、研究の単位、処置、潜在的な結果を明確に定義するために、すべての単位に対する潜在的結果と処置効果を示した表（表2.5）を作成することが役立つことが多い。このような表を想像できない場合は、単位、処置、潜在的結果の定義をより明確にする必要があるかもしれない。
  point: |
    潜在的結果フレームワークを使用する際、単位、処置、潜在的結果の定義を明確にするための表の作成が役立つ。
- id: 10
  status: draft
  ja: |
    表2.5: 予測結果の表
    人物
    処置条件での収入
    対照条件での収入
    処置効果
    1
    \(Y_1(1)\)
    \(Y_1(0)\)
    \(\tau_1\)
    2
    \(Y_2(1)\)
    \(Y_2(0)\)
    \(\tau_2\)
    \(\vdots\)
    \(\vdots\)
    \(\vdots\)
    \(\vdots\)
    N
    \(Y_N(1)\)
    \(Y_N(0)\)
    \(\tau_N\)
    平均
    \(\bar{Y}(1)\)
    \(\bar{Y}(0)\)
    \(\bar{\tau}\)
  point: |
    表は、各個人の処置条件と対照条件での収入、ならびにその処置効果を示している
- id: 11
  status: draft
  ja: |
    このように因果効果を定義すると、両方の潜在的な結果を観察できないという重大な問題に直面します。つまり、特定の個人はサービスを受けたか受けなかったかのどちらかであり、その結果、\(Y_i(1)\)または\(Y_i(0)\)の一方のみを観察できますが、両方ではありません。この両方の潜在的な結果を観察できないことは、因果推論における基本的な問題と呼ばれています（Holland, 1986）。
  point: |
    両方の潜在的な結果を観察できないことが因果推論における基本的な問題である
- id: 12
  status: draft
  ja: |
    幸いなことに、研究を行う際には一人の人間ではなく、多くの人々が存在し、これは因果推論の基本問題に対する解決策を提供します。個々のレベルでの処置効果を推定しようとするのではなく、すべての単位に対する平均処置効果を推定することができます：
  point: |
    多くの人々を利用することで、個々のレベルでの処置効果ではなく、全体の平均処置効果を推定することが可能になる
- id: 13
  status: draft
  ja: |
    ATE = \(\bar{\tau} = \frac{1}{N} \sum_{i=1}^N \tau_i\)
    (2.2)
  point: |
    平均処理効果(ATE)は、\(\bar{\tau} = \frac{1}{N} \sum_{i=1}^N \tau_i\)で定義される
- id: 14
  status: draft
  ja: |
    この方程式は依然として観測不能な\(\tau_i\)を用いて表現されているが、いくつかの代数的変形（Gerber and Green (2012) の式 2.8）により、次のように得られる。
  point: |
    観測不能な\(\tau_i\)を用いた方程式は代数的変形により別の形式を得られる
- id: 15
  status: draft
  ja: |
    平均処理効果（Average Treatment Effect: ATE）は、\[ \text{ATE} = \frac{1}{N} \sum_{i=1}^N Y_i(1) - \frac{1}{N} \sum_{i=1}^N Y_i(0) \]で与えられる。
  point: |
    平均処理効果（ATE）は、処理群と対照群の差の平均で定義される。
- id: 16
  status: draft
  ja: |
    これは、処置下の人口平均結果（\(N^{-1} \sum_{i=1}^N Y_i(1)\)）と対照条件の人口平均結果（\(N^{-1} \sum_{i=1}^N Y_i(0)\)）を推定できれば、個々の人の処置効果を推定せずに平均処置効果を推定できるということを示しています。
  point: |
    人口平均結果から平均処置効果を推定できる
- id: 17
  status: draft
  ja: |
    私が定義した推定量、つまり我々が推定しようとしているものについて説明したので、次にデータを使ってそれを実際にどのように推定できるかについて述べる。ここで我々は直接問題に直面する、各個人について我々が観察できるのは潜在的な結果の一方のみであり、\(Y_i(0)\)または\(Y_i(1)\)のいずれかを見るだけである（表2.6を参照）。我々は、兵役に就いた人々の収入と兵役に就かなかった人々の収入を比較することで平均処置効果を推定できるだろう。
  point: |
    各個人の潜在的な結果の一方しか観察できないため、兵役に就いた人々と兵役に就かなかった人々の収入を比較して平均処置効果を推定する。
- id: 18
  status: draft
  ja: |
    \[ \widehat{\text{ATE}} = \underbrace{\frac{1}{N_t} \sum_{i:W_i=1} Y_i(1)}_{\text{処置群の平均収入}} - \underbrace{\frac{1}{N_c} \sum_{i:W_i=0} Y_i(0)}_{\text{対照群の平均収入}} \qquad(2.4) \]
  point: |
    ATEは処置群の平均収入と対照群の平均収入の差で定義される
- id: 19
  status: draft
  ja: |
    \(N_t\) と \(N_c\) はそれぞれ処置群と対照群の人数を表し、このアプローチは処置割り当てが潜在的結果に独立であるという条件（無視可能性）が満たされる場合にうまく機能します。しかし、実験がない場合、無視可能性は満たされにくく、式2.4の推定値は良い推定値を生成しない可能性が高いです。つまり、ランダムな処置割り当てがない場合、式2.4は似たような人々を比較していないだけであり、異なる種類の人々の収入を比較しているということになります。言い換えると、ランダムな処置割り当てがない場合、処置割り当ては潜在的結果に関連している可能性があります。
  point: |
    ランダムな処置割り当てがない場合、式2.4は良い推定値を生成しない可能性が高い。
- id: 20
  status: draft
  ja: |
    第4章では、ランダム化制御試験が研究者が因果関係の推定を行うのにどのように役立つかを説明し、ここでは研究者がドラフト抽選のような自然実験を利用する方法について述べる。
  point: |
    研究者が因果関係を推定するためのランダム化制御試験と自然実験の利用方法について説明する。
- id: 21
  status: draft
  ja: |
    表2.6: 観測結果の表
    人物
    処置条件での収入
    対照条件での収入
    処置効果
