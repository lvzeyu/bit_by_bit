- id: 8
  status: draft
  ja: |
    一部の公衆衛生擁護者は電子タバコが禁煙の効果的な支援ツールであると考えていますが、他の人々はニコチンの高濃度など潜在的なリスクについて警告しています。ある研究者が電子タバコに対する公衆の意見を調査するために、関連するツイートを集め、感情分析を行うことを決めました。この研究ではどのようなバイアスが最も懸念されるでしょうか。クラークら（2016）はまさにこのような研究を行いました。彼らは2012年1月から2014年12月までの期間に電子タバコに関連するキーワードを使用した85万件のツイートを集めました。詳細な調査により、これらのツイートの多くが自動生成されたもの（つまり人間によって生成されないもの）であり、その多くが実質的に広告であることがわかりました。彼らは人間生成のツイートと自動生成のツイートを分けるための人間検出アルゴリズムを開発しました。このアルゴリズムを使用して、ツイートの80%が自動生成であることがわかりました。この結果は、あなたが(a)の部分で答えた内容を変えるでしょうか。人間生成のツイートと自動生成のツイートの感情を比較すると、自動生成のツイートの方が人間生成のツイートよりもポジティブでした（6.17対5.84）。この結果は、あなたが(b)の部分で答えた内容を変えるでしょうか。
  point: |
    ツイートの自動生成によるバイアス、ポジティブな感情のバイアスが懸念される。
- id: 9
  status: draft
  ja: |
    2009年11月、Twitterはツイートボックスの質問を「What are you doing?」から「What’s happening?」に変更しました（https://blog.twitter.com/2009/whats-happening）。
    この質問の変更が誰がツイートするか、または彼らが何をツイートするかにどのような影響を与えると考えられますか？
    「What are you doing?」というプロンプトを好む研究プロジェクトの1つを挙げ、その理由を説明してください。
    「What’s happening?」というプロンプトを好む研究プロジェクトの1つを挙げ、その理由を説明してください。
  point: |
    Twitterのプロンプト変更がツイート内容やユーザーに与える影響について考察し、それぞれのプロンプトを好む研究プロジェクトとその理由を述べよ。
- id: 10
  status: draft
  ja: |
    「リツイート」は、Twitter上で影響力とその影響力を広げる度合いを測る際に頻繁に使用される。当初、ユーザーは好むツイートをコピーし、ペーストし、元の著者をハンドルでタグ付けし、「RT」という文字を手動でツイートの前に付ける必要があった。その後、2009年にTwitterは「リツイート」ボタンを追加した。そして2016年6月、Twitterはユーザーが自分のツイートをリツイートできるようにした（https://twitter.com/twitter/status/742749353689780224）。これらの変更は、あなたの研究における「リツイート」の使用に影響を与えるべきだと思いますか？なぜですか、またはなぜではないですか？
  point: |
    Twitterのリツイート機能の変更が研究におけるリツイートの使用に影響を与えるべきかどうか。
- id: 11
  status: draft
  ja: |
    Michelら（2011）は、500万冊以上のデジタル化された本の内容を分析し、長期的な文化的トレンドを特定しようと試みた論文において、我々は過去の出来事に対する関心度を測る指標として、特定の年（例えば「1883」）が各年間に出版された1-グラムの割合を計算した。彼らは、その割合がその年の出来事に対する関心度を示す指標であると主張し、1883年、1910年、1950年の使用動向をプロットした。これらの3つの年は、その年以前は使用頻度が低く、その後ピークを迎え、徐々に減少するという共通のパターンを示した。次に、各年の減少率を量化的に評価するために、1875年から1975年までの各年の「半減期」を計算した。彼らは、その半減期が減少していることを示し、これは我々が過去を忘れている速度が速くなっていることを意味すると主張した。彼らは英語版コーパスのバージョン1を使用したが、その後Googleはコーパスのバージョン2をリリースした。この活動では、再利用可能なコードの作成、結果の解釈、データの取り扱い（不適切なファイルや欠損データの処理など）の練習を行う。また、豊富で興味深いデータセットとの対話も可能となる。
    Google Books NGram Viewerウェブサイトから生データを取得せよ。特に、2012年7月1日にリリースされた英語版コーパスのバージョン2を使用せよ。このファイルは圧縮されていない状態で1.4GBである。Michelら（2011）の図3aの主要部分を再現せよ。この図を再現するには、ダウンロードしたファイルと「総数」ファイルが必要である。総数ファイルは読み込みにくい構造を持っている可能性があることに注意せよ。NGramデータのバージョン2は、バージョン1に基づくMichelら（2011）の結果と似た結果を生むか確認せよ。グラフをNGram Viewerによって作成されたものと比較せよ。図3a（主図）を再現せよが、\(y\)軸を言及回数の原始値（割合ではなく）に変更せよ。図（b）と図（d）の違いは、Michelら（2011）の結果を再評価する必要があるか？なぜか、なぜなら？言及割合を使用して、図3aの挿絵を再現せよ。すなわち、1875年から1975年までの各年の半減期を計算せよ。半減期は、言及割合がピークの半分になるまでにかかる年数を定義する。Michelら（2011）はより複雑な方法で半減期を推定しているが、両方のアプローチは似たような結果を生むと主張している。NGramデータのバージョン2は、バージョン1に基づくMichelら（2011）の結果と似た結果を生むか？（ヒント：一致しない場合でも驚かないように。）どの年が異常値（特に早く忘れられたり、遅く忘れられたり）だったかを特定し、そのパターンの理由を簡単に推測せよ。次に、中国語、フランス語、ドイツ語、ヘブライ語、イタリア語、ロシア語、スペイン語のNGramsデータのバージョン2に対して、この結果を再現せよ。すべての言語を比較した場合、どの年が異常値（特に早く忘れられたり、遅く忘れられたり）だったかを特定し、そのパターンの理由を簡単に推測せよ。
  point: |
    Michelら（2011）は、デジタル化された本のデータを用いて、我々が過去を忘れている速度が増していることを示した。
- id: 12
  status: draft
  ja: |
    Penney (2016) 調査したのは、2013年6月に広く公表されたNSA/PRISM監視（Snowden漏洩）がプライバシーに関する懸念を引き起こすWikipedia記事へのトラフィックに急激な減少をもたらしたかどうかである。この変化は大量監視による寒蟄効果の一環である可能性がある。Penneyのアプローチは中断時間系列設計と呼ばれ、セクション2.4.3で説明されているアプローチに関連している。トピックキーワードの選択には、米国国土安全保障省がソーシャルメディアの追跡とモニタリングのために使用しているリストを参照した。研究グループでは、「テロリズム」に関連する48のキーワードを使用し、それに対応する48のWikipedia記事のページビュー数を2012年1月から2014年8月までの32ヶ月間月ごとに集計した。さらに、他のトピックの記事のページビューを追跡することで比較グループを作成した。この活動では、データの取り扱いやビッグデータソースでの自然実験の思考を練習し、今後のプロジェクトで使用できる可能性のある興味深いデータソースとの対話を行う。
    Penney (2016) を読み、Snowden漏洩前後での「テロリズム」関連ページのページビューを示す図2を再現し、その結果を解釈する。次に、DHSリストの「DHS & Other Agencies」カテゴリのキーワードを使用した比較グループとの比較を示す図4Aを再現し、その結果を解釈する。部分(b)では、一つの比較グループと研究グループを比較したが、Penneyは「インフラセキュリティ」関連記事と人気のあるWikipediaページとの比較も行った。異なる比較グループを選択した場合、部分(b)の結果がどの程度影響を受けるかを検討し、最も意味のある選択は何か、なぜそれが最も意味があるのかを説明する。Penneyは「テロリズム」関連キーワードを選んだ理由として、アメリカ政府がオンライン監視の正当化としてテロリズムを挙げていることを挙げている。PenneyはMTurkでこれらの48の「テロリズム」関連キーワードに対する調査を行い、各キーワードに対する「政府問題」「プライバシー感度」「避難」の評価を行った。自身でMTurkで同様の調査を行い、結果を比較する。部分(d)の結果とPenneyの論文を読んだ上で、Penneyのトピックキーワードの選択に同意するか、なぜ同意するか、またはなぜしないか、代わりに何を提案するかを述べる。
  point: |
    Penney (2016) は、Snowden漏洩がプライバシー関連のWikipedia記事へのアクセスに影響を与えたかどうかを調査し、その方法と結果を再現・拡張する。
- id: 13
  status: draft
  ja: |
    Efrati（2016）は、機密情報に基づいて、「完全共有」が年率約5.5%減少し、「オリジナル放送共有」が年率21%減少したと報告した。この減少は特に30歳未満のFacebookユーザーにおいて顕著であり、その原因として「友達」の数の増加と一部の共有活動がメッセージングやSnapchatなどの競合他社に移行していることが挙げられた。また、Facebookが共有を促進するために試みたいくつかの戦略も明らかにされ、その中にはオリジナル投稿をより目立つようにするためのニュースフィードアルゴリズムの調整や、「今日は」機能による定期的なオリジナル投稿の思い出させなどが含まれていた。
  point: |
    Facebookの「完全共有」が5.5%、「オリジナル放送共有」が21%減少しており、これは「友達」の増加と他のプラットフォームへの移行が原因とされる。
- id: 14
  status: draft
  ja: |
    社会学者と歴史家の違いは何でしょうか？ゴールドソープ（1991）によれば、主な違いはデータ収集に対する制御力にあります。歴史家は遺物を使用せざるを得ないのに対し、社会学者はデータ収集を特定の目的に合わせて調整することができます。ゴールドソープ（1991）を参照してください。社会学と歴史の違いがカスタムメイドとオフザラックの概念に関係しているのはなぜでしょうか？
  point: |
    社会学者と歴史家の主な違いはデータ収集の制御力であり、歴史家は遺物に依存せざるを得ないのに対し、社会学者はデータ収集を特定の目的に合わせて調整できる。
- id: 15
  status: draft
  ja: |
    これは前問につづくものである。Goldthorpe (1991) は多くの批判的な反応を引き起こし、その中には Nicky Hart (1994) のある反論が含まれていた。Hart は、Goldthorpe のカスタムデータへの献身を疑問視し、社会階級と投票の関係を測定するために1960年代半ばに Goldthorpe と同僚によって実施された大規模な調査「裕福な労働者プロジェクト」を例に挙げた。このプロジェクトは、生活水準の向上という時代背景の中で社会階級の将来に関する最近提唱された理論に対応するように設計されたデータを集めた。しかし、男性中心の理論によって女性の投票行動に関する情報が意図的に省かれたことが明らかになった。Nicky Hart (1994) は次のように要約した：
    「… 女性が省かれたのは、このカスタムデータセットが女性の経験を排除するパラダイム論理によって制約されていたからだと避けるのが難しい。クラス意識と行動を男性の関心事と見なす理論的ビジョンに駆動されて、Goldthorpe と同僚は自らの理論的前提を検証するのではなく、それを養い育てた一連の実証的証拠を構築した。」
    Hart はさらに次のように述べた：
    「裕福な労働者プロジェクトの実証的発見は、中世紀の社会学における男性中心主義の価値観を我々に教えるよりも、階層化、政治、物質的生活の過程を我々に教えるものではない。」
    カスタムデータ収集にデータ収集者のバイアスが組み込まれる他の例を思いつくことができるだろうか？これはアルゴリズム的混同行の比較とはどのように異なるのか？研究者が既製品を使用すべきときとカスタム製品を使用すべきときとはどのような違いがあるのか？
  point: |
    Nicky Hartは、Goldthorpeの「裕福な労働者プロジェクト」が女性の投票行動に関する情報を意図的に省いたことを指摘し、データ収集者のバイアスがカスタムデータに組み込まれる可能性を示している。
- id: 16
  status: draft
  ja: |
    この章では、研究者が他の研究者のために収集したデータと、企業や政府が作成した行政記録を対比しました。一部の人々は、これらの行政記録を「見つけたデータ」と呼び、これと「設計されたデータ」を対比しています。確かに行政記録は研究者が見つけますが、それらはまた非常に設計されています。たとえば、現代のテクノロジー企業はデータの収集とキュレーションに非常に努力を払います。したがって、これらの行政記録は見つけたものであり、設計されたものでもあり、視点によるところが大きい（図2.12）。
    図2.12：この絵は同時にダックとラビットとして見えます；あなたが何を見るかは視点によるところが大きい。ビッグデータのソースは見つけたものであり、設計されたものでもあります；また、あなたが何を見るかは視点によるところが大きい。たとえば、モバイル電話会社が収集した通話データレコードは、研究者の視点からは見つけたデータですが、電話会社の請求部門で働く人々の視点からは設計されたデータです。出典：Popular Science Monthly (1899)/Wikimedia Commons。
    見つけたデータと設計されたデータの両方としてそのデータソースを認識することが、そのデータソースを研究に使用する際に役立つ例を提供してください。
  point: |
    行政記録は研究者から見れば見つけたデータだが、企業や政府から見れば設計されたデータであり、視点によって異なる。
- id: 17
  status: draft
  ja: |
    クリスチャン・サンドヴィグとエスター・ハーギッタイ（2015）は、洞察に富む論考において、デジタルシステムが「道具」として使用されるか「研究対象」となるかによって、デジタル研究を大きく2つのカテゴリーに分類した。デジタルシステムが「道具」として使用される例としては、ベンクトソンら（2011）による2010年のハイチ地震後の移動をモバイル電話データで追跡する研究がある。一方、デジタルシステムが「研究対象」となる例としては、ジェンセン（2007）によるインドケララ州での携帯電話の導入が魚市場の機能にどのような影響を与えたかを研究する例がある。この区別は、同じ種類のデータソースを使用していても、研究の目的が全く異なる場合があることを明確にするため、非常に役立つ。
  point: |
    デジタルシステムが「道具」として使用される研究と「研究対象」となる研究の違いを示し、前者の例としてハイチ地震後の移動追跡研究、後者の例としてインドケララ州での携帯電話導入の影響研究を挙げた。
