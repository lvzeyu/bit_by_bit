# 2.3 Ten common characteristics of big data
# 原文: https://www.bitbybitbook.com/en/1st-ed/observing-behavior/characteristics/
# 每段一条,id 对应页面上的段落编号。status: todo / draft / reviewed
# 可选字段(按需添加): vocab([{term, gloss}])、syntax、background
blocks: 6   # 原文段落数,build 时校验
paragraphs:
- id: 1
  status: draft
  ja: |
    ビッグデータのソースには一般的にいくつかの共通する特性があり、その中には社会研究にとって一般的に良いものと悪いものがある。
  point: |
    ビッグデータには社会研究にとって良い特性と悪い特性がある
- id: 2
  status: draft
  ja: |
    それぞれの大規模データソースが独自の特性を持つ一方で、特定の一般的な特性が再三見受けられる点に注意することが有益である。プラットフォームごとのアプローチ（例えば、Twitterについて知るべきこと、Google検索データについて知るべきことなど）ではなく、大規模データソースの一般的な10つの特性を説明することで、研究者は既存のデータソースについて素早く学び、将来生成されるデータソースに対して適用可能な明確なアイデアを得ることができる。
  point: |
    大規模データソースの一般的な特性を理解することで、既存のデータソースを素早く学び、将来のデータソースにも適用可能なアイデアを得ることができる
- id: 3
  status: draft
  ja: |
    研究目的に依存するデータソースの望ましい特性がある一方で、私は粗大だが、10の特性を2つの大きなカテゴリーに分類することの有用性を見出している。
  point: |
    データソースの特性を2つの大きなカテゴリーに分類することが研究目的によらず有用である
- id: 4
  status: draft
  ja: |
    研究のために一般的に役立つもの：大規模で、常にオンで、非反応的である
  point: |
    研究に有用な特性は大規模で常に活動的であり、かつ非反応的であることである
- id: 5
  status: draft
  ja: |
    研究にとって一般的に問題となる要素は、不完全な、アクセス不能な、非代表的な、移り変わる、アルゴリズム的に混同された、汚染された、そして機密性の高いものである。
  point: |
    研究にとって問題となる要素は、不完全さ、アクセス不能性、非代表性、変動性、アルゴリズム的混同、汚染、機密性である。
- id: 6
  status: draft
  ja: |
    これらの特性を説明していると、大規模データソースが研究のために作成されたものではなく、その他の目的で作成されたためにこれらの特性が生じることがよくあることに気付くでしょう。
  point: |
    大規模データソースが研究目的で作成されたものではないことが多くの特性の原因となっている。
