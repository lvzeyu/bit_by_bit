# 2.4 Research strategies
# 原文: https://www.bitbybitbook.com/en/1st-ed/observing-behavior/strategies/
# 每段一条,id 对应页面上的段落编号。status: todo / draft / reviewed
# 可选字段(按需添加): vocab([{term, gloss}])、syntax、background
blocks: 1   # 原文段落数,build 时校验
paragraphs:
- id: 1
  status: draft
  ja: |
    与えられたビッグデータソースの10つの特性と、完全に観測されたデータにさえ内在する限界を考慮して、ビッグデータソースから学ぶための3つの主要な戦略がある。それは、物事を数える、物事を予測する、実験を近似するという方法であり、それぞれのアプローチを「研究戦略」または「研究レシピ」と呼んでもよい。これらの戦略は互いに排他的でも、網羅的でもない。
  point: |
    ビッグデータから学ぶ3つの主要な戦略は、物事を数える、予測する、実験を近似することである。
  vocab:
    - {term: "counting", gloss: "数え上げ"}
    - {term: "forecasting", gloss: "予測"}
