- id: 14
  status: draft
  ja: |
    これまでの自然実験に関する議論では重要な点を省いてきました：自然が提供したものを求めているものに結びつけることは時に非常に厄介です。ベトナム徴兵の例に戻ります。この場合、アングリストは兵役が収入に及ぼす影響を推定しようとしていました。しかし、兵役はランダムに割り当てられていませんでした。代わりに、徴兵がランダムに割り当てられていたのです。ただし、徴兵された全員が兵役に就いたわけではなく（様々な免除があった）、兵役に就いた全員が徴兵されたわけでもありません（志願して兵役に就くことも可能でした）。徴兵がランダムに割り当てられたため、研究者は徴兵された全ての男性に対する徴兵の影響を推定することができます。しかし、アングリストが知りたかったのは徴兵の影響ではなく、兵役の影響でした。この推定を行うには、追加の仮定と複雑さが必要となります。まず、研究者は徴兵が収入に影響を与える唯一の方法が兵役を通じてであるという仮定、これを除外制約と呼びます、を仮定する必要があります。この仮定が誤っている可能性があります。例えば、徴兵された男性が兵役を避けるために更に学校に通い続けるか、雇用主が徴兵された男性を雇う可能性が低い場合などです。一般的に、除外制約は重要な仮定であり、通常は確認するのが難しいです。除外制約が正しい場合でも、兵役の影響を全ての男性に対して推定することは不可能です。代わりに、研究者は特定のサブセットの男性、つまりコンプライアー（徴兵された場合には兵役に就くが、徴兵されなければ兵役に就かない男性）に対する影響を推定することができます（Angrist, Imbens, and Rubin 1996）。しかし、これらの問題はコンプライアーが当初の関心の対象ではなかったことを注意してください。これらの問題は、比較的クリーンなケースである抽選でも発生します。処置が物理的な抽選によって割り当てられない場合、さらなる一連の複雑さが生じます。例えば、MasとMorettiのキャッシャーの研究では、同僚の割り当てが基本的にはランダムであるという仮定についての追加の質問が生じます。この仮定が強く違反された場合、それは彼らの推定を偏らせる可能性があります。結論として、自然実験は非実験データから因果推定を行うための強力な戦略であり、ビッグデータソースは自然実験が発生したときにそれを利用する能力を高めます。しかし、自然が提供したものを求めている推定に結びつけるには、おそらく慎重さと時として強い仮定が必要となるでしょう。
  point: |
    自然実験から求めている推定を得るためには慎重さと強い仮定が必要である。
    「自然実験」は研究者以外が生んだ偶然に近い条件差を利用する研究である。
  vocab:
    - {term: "exclusion restriction", gloss: "除外制約"}
- id: 15
  status: draft
  ja: |
    非実験データから因果推定を行うための2つ目の戦略は、統計的に非実験データを調整し、処置を受けた人と受けなかった人との事前の違いを考慮しようとするものであり、その中でもマッチングというアプローチに焦点を当てます。マッチングでは、研究者が非実験データから処置を受けた人と受けなかった人が似ているペアを作成しますが、明らかに一致するケースがない場合はそれらを削除します。したがって、この方法は正確にはマッチング・アンド・プリーニングと呼ばれるべきですが、伝統的な用語であるマッチングを使用します。
  point: |
    非実験データから因果関係を推定するためのマッチング法とは、処置を受けた人と受けなかった人を類似性でペアリングしつつ、一致しないケースを除外する方法である。
    「非実験データ」は研究者が処置を無作為に割り当てていないデータである。
  vocab:
    - {term: "matching", gloss: "マッチング"}
    - {term: "treatment", gloss: "処置"}
- id: 16
  status: draft
  ja: |
    オークション戦略と大量の非実験データソースの力の一例は、Liran Einavらの消費者行動に関する研究（2015）から得られます。彼らはeBayで行われるオークションに興味があり、その研究を説明する際には、オークション開始価格が販売価格や販売確率などのオークション結果に及ぼす影響に焦点を当てます。
  point: |
    Liran Einavらの研究は、オークション開始価格がオークション結果に与える影響をeBayのデータを使って分析している。
- id: 17
  status: draft
  ja: |
    最も素朴な方法は、異なる開始価格を持つオークションの最終価格を単純に計算することである。このアプローチは、開始価格が与えられた場合の販売価格を予測したい場合に適しているが、開始価格の影響に関心がある場合は機能しない。なぜなら、これは公平な比較に基づいていないからであり、低い開始価格を持つオークションは、高い開始価格を持つオークションとは異なる可能性がある（例えば、異なる商品や異なる種類の販売者が含まれる可能性がある）。
  point: |
    「公平な比較」とは、開始価格以外の条件が似た出品を比べることである。価格だけで出品を分けると、品物や売り手の違いまで効果に混ざる。
  vocab:
    - {term: "starting price", gloss: "開始価格"}
