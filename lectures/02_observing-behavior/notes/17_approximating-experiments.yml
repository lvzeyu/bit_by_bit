- id: 18
  status: draft
  ja: |
    因果推定を行う際に非実験データから生じる問題を既に認識している場合、素朴なアプローチをスキップし、特定の商品（例えばゴルフクラブ）を固定されたオークションパラメータ（無料配送、2週間のオークション期間）でランダムに設定した開始価格で販売するフィールド実験を実施することを検討することができる。このフィールド実験は開始価格が販売価格に及ぼす影響を明確に測定するが、これは特定の商品とパラメータセットに限定され、他の商品タイプでは結果が異なる可能性がある。強力な理論がない限り、この単一の実験から全実験の範囲を外挿することは困難であり、さらにフィールド実験は費用がかかるため、試したいすべてのバリエーションを実施することは現実的ではない。
  point: |
    フィールド実験は開始価格の影響を明確に測定できるが、特定の商品とパラメータセットに限定され、全実験の範囲を外挿するのは困難で、費用もかかる。
  vocab:
    - {term: "theory", gloss: "理論"}
- id: 19
  status: draft
  ja: |
    エイナブらは、ナイーブなアプローチや実験的アプローチとは対照的に、マッチングという第三のアプローチを採用した。彼らの戦略の主なトリックは、eBayで既に起こっているフィールド実験と似たようなことを発見することにある。例えば、図2.8には、同じ「budgetgolfer」という販売者が販売する全く同じゴルフクラブ（Taylormade Burner 09 Driver）の31のリストが示されており、これらのリストには開始価格、終了日、送料など、若干異なる特徴がある。つまり、「budgetgolfer」が研究者たちのために実験を行っているかのように見えるのである。
  point: |
    エイナブらは、eBay上の既存のリスト情報を用いて、販売者の「budgetgolfer」が同様のゴルフクラブを異なる条件で31回販売した事例を分析することで、マッチングという第三のアプローチを採用した。
    「マッチング」は観測できる特徴が似た対象どうしを比べる方法である。
  vocab:
    - {term: "running experiments", gloss: "実験を行うこと"}
- id: 20
  status: draft
  ja: |
    "budgetgolfer"が販売しているTaylormade Burner 09 Driverのリストは、同じ商品が若干異なる特性で販売される一連のリストの例である。eBayの膨大なログには、数百万人のリストが関与する数十万のマッチドセットが存在し、Einavらはこれらのセット内で最終価格と開始価格を比較した。さらに、各アイテムの参照価値（例えば平均販売価格）に基づいて開始価格と最終価格を再表現し、結果を統合した。例えば、Taylormade Burner 09 Driverの参照価値が100ドルである場合、開始価格10ドルは0.1、最終価格120ドルは1.2と表現された。
  point: |
    Einavらは、eBay上の数十万のマッチドセット内で、開始価格と最終価格を参照価値に基づいて再表現して比較した。
  vocab:
