- id: 22
  status: draft
  ja: |
    回想してみてください。Einavらはオークションの結果に開始価格が及ぼす影響に関心がありました。まず、彼らは線形回帰を使用して、開始価格が高いほど販売確率が下がり、開始価格が高いほど最終販売価格（販売が行われた場合に限る）が上昇することを推定しました。これらの推定値は、線形の関係を記述し、すべての製品の平均値を示しており、それ自体ではそれほど興味深いものではありません。次に、Einavらはデータの大規模さを利用して、より微妙な推定を生成しました。例えば、さまざまな開始価格ごとに効果を別々に推定することで、開始価格と販売価格との関係が非線形であることを発見しました（図2.9）。特に、開始価格が0.05から0.85の間の範囲では、開始価格は販売価格にほとんど影響を与えず、これは最初の分析では全く見逃されていました。さらに、全アイテムを平均化するのではなく、Einavらは23種類の異なるアイテムのカテゴリー（ペット用品、電子機器、スポーツ記念品など）ごとに開始価格の影響を推定しました（図2.10）。これらの推定は、記念品のような特徴的なアイテムでは、開始価格は販売確率に小さな影響しか与えず、最終販売価格には大きな影響を与えることを示しています。さらに、DVDのような商品化されたアイテムでは、開始価格は最終価格にほとんど影響を与えません。言い換えれば、23種類の異なるアイテムのカテゴリーからの結果を平均化することは、これらのアイテム間の重要な違いを隠すことになります。
  point: |
    「線形回帰」は変数間の平均的な直線関係を推定する方法である。全商品をまとめた平均だけでは、開始価格の影響が商品や価格帯でどう変わるかを捉えにくい。
  vocab:
    - {term: "linear regression", gloss: "線形回帰"}
    - {term: "starting prices", gloss: "開始価格"}
- id: 23
  status: draft
  ja: |
    オークションの開始価格と売却確率（a）および売却価格（b）との関係。開始価格と売却確率の間には概ね線形の関係があるが、開始価格と売却価格の間には非線形の関係があり、開始価格が0.05から0.85の範囲内では、開始価格は売却価格にほとんど影響を与えない。両方の場合、これらの関係は基本的にアイテムの価値とは独立である。Einav et al. (2015) の図4aと4bを元に作成。
  point: |
    開始価格と売却確率は線形、売却価格は非線形の関係であり、開始価格が0.05から0.85の範囲では売却価格にほとんど影響しない。
  vocab:
    - {term: "linear relationship", gloss: "線形関係"}
    - {term: "nonlinear relationship", gloss: "非線形関係"}
