- id: 25
  status: draft
  ja: |
    オークションに特別な興味がなくても、図2.9と図2.10が単純な線形関係を説明する推定値よりも豊かな理解を提供することには敬意を表さざるを得ない。さらに、これらのより微妙な推定値をフィールド実験で生成することは科学的には可能だが、コストはそのような実験を事実上不可能にするだろう。
  point: |
    図2.9と図2.10が単純な線形関係の推定値よりも豊かな理解を提供し、そのような推定値を生成する実験はコスト的に不可能である
